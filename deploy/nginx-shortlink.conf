# Configuração nginx para o subdomínio de shortlinks
# go.techmidia.com → affiliate-link-builder (porta 18790)
#
# Instalar:
#   sudo cp nginx-shortlink.conf /etc/nginx/sites-available/go.techmidia.com
#   sudo ln -s /etc/nginx/sites-available/go.techmidia.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d go.techmidia.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name go.techmidia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name go.techmidia.com;

    # Certbot preenche automaticamente
    # ssl_certificate     /etc/letsencrypt/live/go.techmidia.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/go.techmidia.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:18790;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }
}
